<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apex · Жавоб</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--ink:var(--tg-theme-text-color,#1f1a17);--muted:var(--tg-theme-hint-color,#7a716b);
--soft:var(--tg-theme-secondary-bg-color,#f1f3f5);--accent:var(--tg-theme-button-color,#2a8bd8);--accent-ink:var(--tg-theme-button-text-color,#fff);
--line:color-mix(in srgb,var(--ink) 14%,transparent);--tomato:#d7261e;--basil:#2f8f4e;--amber:#e39b14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;padding:14px 16px 90px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top img{width:34px;height:34px;border-radius:9px}
.top b{font-size:16px}
.q{font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.items{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:10px;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.item[aria-pressed="true"]{border-color:var(--tomato)}
.thumb{flex:none;width:46px;height:40px;border-radius:9px;background:#0e2233;color:#ff7b6e;font-weight:800;display:grid;place-items:center;font-size:17px}
.item small{color:var(--muted);display:block}
.timer{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;color:var(--amber);text-align:right;white-space:nowrap}
.timer.over{color:var(--tomato)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 8px;text-align:left;cursor:pointer;font:inherit;font-size:13.5px;line-height:1.25;display:flex;gap:8px;align-items:center}
.chip .e{font-size:20px}
.chip[aria-pressed="true"]{border-color:var(--tomato);background:color-mix(in srgb,var(--tomato) 10%,var(--bg))}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg .chip{flex-direction:column;text-align:center;gap:2px;padding:8px 4px}
.seg .chip[aria-pressed="true"]{border-color:var(--basil);background:color-mix(in srgb,var(--basil) 12%,var(--bg))}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:14px;background:var(--soft);color:var(--ink);resize:none;height:60px}
#fallback{position:fixed;left:0;right:0;bottom:0;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px))}
#fallback:disabled{opacity:.45}
.empty{color:var(--muted);text-align:center;padding:30px 0}
</style></head><body>

<div id="list"></div>
<div class="q">Сабаби нима?</div>
<div class="chips" id="why"></div>
<div class="q">Нима қилинди?</div>
<div class="seg" id="act"></div>
<div class="q">Изоҳ</div>
<textarea id="note" maxlength="300" placeholder="Ихтиёрий"></textarea>
<button id="fallback" type="button" hidden>Юбориш</button>
<script>
const tg=window.Telegram&&Telegram.WebApp;
const LIMIT=30*60;
const REASONS={
 q:[["📞","Қўнғироқ жуда кўп"],["🎧","Ҳамма оператор банд"],["☕","Оператор танаффусда"],["🔌","АТС / интернет муаммо"],["🙋","Оператор етишмаяпти"],["✏️","Бошқа сабаб"]],
 o:[["🚶","Оператор жойида йўқ"],["☕","Оператор танаффусда"],["📵","Телефон / гарнитура носоз"],["🔌","АТС / интернет муаммо"],["🗣","Мижоз билан гаплашяпти"],["✏️","Бошқа сабаб"]]};
const ACTS=[["✅","Ҳал бўлди"],["⏳","Ҳал қиляпман"],["🆘","Ёрдам керак"]];
function decode(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(b))}catch(e){return[]}}
const items=decode(new URLSearchParams(location.search).get('p')||'');
let cur=items.length?items[items.length-1]:null,why=null,act=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function left(k){return LIMIT-(Math.floor(Date.now()/1000)-k)}
function fmt(t){if(t<=0)return'Вақт ўтди';return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderList(){
 const L=document.getElementById('list');
 if(!items.length){L.innerHTML='<div class="empty">Жавоб кутаётган скриншот йўқ.</div>';return}
 L.innerHTML='<div class="items">'+items.slice().reverse().map(i=>'<button class="item" type="button" data-k="'+i.k+'" aria-pressed="'+(cur&&cur.k===i.k)+'"><div class="thumb">'+esc(i.n||'!')+'</div><div><b>'+esc(i.l)+'</b><small>'+esc(i.h)+' · скриншот</small></div><div class="timer" data-t="'+i.k+'"></div></button>').join('')+'</div>';
 L.querySelectorAll('.item').forEach(b=>b.onclick=()=>{cur=items.find(i=>String(i.k)===b.dataset.k);why=null;renderList();renderChips();upd()});
 tick();
}
function tick(){document.querySelectorAll('.timer').forEach(el=>{const t=left(+el.dataset.t);el.textContent=fmt(t);el.classList.toggle('over',t<=0)})}
setInterval(tick,1000);
function group(id,list,cb){const g=document.getElementById(id);g.innerHTML=list.map(([e,t])=>'<button class="chip" type="button" aria-pressed="false"><span class="e">'+e+'</span>'+esc(t)+'</button>').join('');
 g.querySelectorAll('.chip').forEach((b,ix)=>b.onclick=()=>{g.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');cb(list[ix][1]);tg&&tg.HapticFeedback&&tg.HapticFeedback.selectionChanged();upd()})}
function renderChips(){group('why',REASONS[(cur&&cur.t)||'q'],v=>why=v)}
group('act',ACTS,v=>act=v);
const fb=document.getElementById('fallback');
function upd(){const ready=cur&&why&&act;const label=!cur?'Скриншот йўқ':!why?'Сабабни танланг':!act?'Ҳолатни танланг':'Юбориш';
 if(tg&&tg.MainButton&&tg.initData!==undefined&&tg.platform!=='unknown'){tg.MainButton.setText(label);ready?tg.MainButton.enable():tg.MainButton.disable();tg.MainButton.show()}
 else{fb.hidden=false;fb.disabled=!ready;fb.textContent=label}}
function send(){if(!(cur&&why&&act))return;const data=JSON.stringify({k:cur.k,w:why,a:act,n:document.getElementById('note').value.trim().slice(0,300)});
 if(tg&&tg.sendData){tg.sendData(data)}else{fb.textContent='Фақат Telegram ичида юборилади'}}
fb.onclick=send;
if(tg){tg.ready();tg.expand();tg.MainButton&&tg.MainButton.onClick(send)}
renderList();renderChips();upd();
</script></body></html>
